# WHY: actionlint 1.7.12 predates three documented GitHub Actions features. Each
# entry accepts exactly one of them without disabling the rule it belongs to:
# - the GitHub-hosted runner label ubuntu-26.04 (declared as a known label; this
#   config does not select or create a self-hosted runner),
# - the job.workflow_repository and job.workflow_sha context properties
#   (upstream closed the request as not planned),
# - the concurrency "queue" key,
# - the self-repository reference "uses: $/...", which GitHub recommends ("Using an action in the same repository
#   as the workflow at the running commit (recommended)") and which MySql uses for its reusable workflow in a green
#   run (44946546212).
# Remove an entry when the pinned actionlint recognizes the feature itself.
# https://github.com/actions/runner-images/issues/14747
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
# https://github.com/rhysd/actionlint/issues/757
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
self-hosted-runner:
  labels:
    - ubuntu-26.04
paths:
  # WHY: GitHub accepts both workflow extensions. actionlint matches paths with doublestar, whose brace
  # alternatives apply the same narrow exceptions to either extension.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#about-yaml-syntax-for-workflows
  # https://github.com/rhysd/actionlint/blob/v1.7.12/config.go
  # https://github.com/bmatcuk/doublestar/blob/v4.10.0/README.md#patterns
  '.github/workflows/**/*.{yml,yaml}':
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
      - 'unexpected key "queue" for "concurrency" section'
      - 'reusable workflow call "\$/\.github/workflows/[^"]+" at "uses" is not following the format'
