# WHY: actionlint 1.7.12 does not know the documented job.workflow_repository and
# job.workflow_sha context properties; upstream closed the request as not planned.
# Only that exact false positive is ignored, nothing else in the expression rule.
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
# https://github.com/rhysd/actionlint/issues/757
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
