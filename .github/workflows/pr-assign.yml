name: PR Assign

# Assigns the author of a new or reopened pull request, so lists show who
# drives it. Bots and pull requests from forks are left alone: no person
# drives a bot's pull request, and a fork's token is read-only.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label with Bash and GitHub CLI installed.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04

permissions: {}

jobs:
  assign:
    name: Assign
    # WHY: "The GITHUB_TOKEN has read-only permissions in pull requests from forked repositories", and Dependabot
    # pull requests are "treated as though they are from a forked repository", so only same-repository pull
    # requests by people can be assigned.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    # WHY: Adding assignees needs the "Pull requests" (or "Issues") repository permission with write access.
    # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps
    permissions:
      pull-requests: write
    runs-on: ${{ inputs.runs-on }}
    # WHY: A bound against hangs: the job makes two API requests.
    timeout-minutes: 5

    steps:
      # WHY: The eligibility check reports 204 for an assignable user and 404 otherwise. Keep other failures
      # visible, including transport errors with no HTTP status. The POST adds to existing assignees.
      # https://docs.github.com/en/rest/issues/assignees#check-if-a-user-can-be-assigned
      # https://cli.github.com/manual/gh_api
      - name: Assign the author
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! response=$(gh api "repos/$GITHUB_REPOSITORY/assignees/$AUTHOR" --include 2>/dev/null); then
            status=${response%%$'\n'*}
            if [[ "$status" =~ ^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$) ]]; then
              echo "::notice::$AUTHOR cannot be assigned in $GITHUB_REPOSITORY."
              exit 0
            fi
            echo "::error::Could not check whether $AUTHOR can be assigned in $GITHUB_REPOSITORY."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
          echo "Assigned $AUTHOR to pull request #$NUMBER."
