name: Release Candidate

# Turns the qualified commit's built packages into a release candidate: checks
# their identity and source binding, restores each package in an isolated
# consumer from the candidate bytes, derives one SBOM per package from that
# consumer, derives the symbol-server probes, attests build provenance and the
# SBOMs, and stores everything as assets of a draft release. A draft does not
# expire and stays out of public view.

on:
  workflow_call:
    inputs:
      version:
        description: Candidate package version.
        type: string
        required: true
      packages-artifact:
        description: Artifact of this run with every .nupkg and its .snupkg.
        type: string
        required: true
      sbom-supplier:
        description: Supplier named in each SBOM.
        type: string
        # WHY: The supplier NestedSet names in its SBOMs.
        default: Doka Labs
      runs-on:
        description: Runner label.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate
    # WHY: contents write creates the draft release; id-token and attestations sign; actions read downloads the
    # packages artifact. https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    runs-on: ${{ inputs.runs-on }}
    # WHY: A bound against hangs: the attestation jobs of the three repositories took at most 1.6 minutes in 56
    # successful runs; building the symbol tool adds about one minute.
    timeout-minutes: 20

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repository

      # WHY: The tools come from the same commit as this workflow, not from a branch head. They run as a package
      # with -E -s from their own checkout: -I would also drop the working directory, which "python -m" otherwise
      # puts first on sys.path. https://docs.python.org/3/using/cmdline.html
      - name: Check out the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Set up the repository's .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: repository/global.json

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.packages-artifact }}
          path: ${{ runner.temp }}/packages

      # WHY: sbom-tool 4.1.5 is the release NestedSet runs and the newest release; the self-contained binary needs
      # no tool installation, and the digest is the one GitHub reports for the release asset.
      # https://github.com/microsoft/sbom-tool/releases/tag/v4.1.5
      - name: Install sbom-tool 4.1.5
        env:
          SHA256: bf5d4f99bc98c119d549d08fc02ae92598a7a42772f17317c01031a92632e05b
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-tool"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/sbom-tool/sbom-tool" \
            https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-linux-x64
          echo "$SHA256  $RUNNER_TEMP/sbom-tool/sbom-tool" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/sbom-tool/sbom-tool"

      # WHY: Component detection and NuGet write scratch files to TMPDIR, and the self-contained binary may extract
      # its runtime; both stay in the job's temp directory (NestedSet's generate-sbom.sh).
      - name: Restore isolated consumers and generate the SBOMs
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUPPLIER: ${{ inputs.sbom-supplier }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-scratch" "$RUNNER_TEMP/sbom-bundle"
          TMPDIR="$RUNNER_TEMP/sbom-scratch" DOTNET_BUNDLE_EXTRACT_BASE_DIR="$RUNNER_TEMP/sbom-bundle" \
            python3 -E -s -m tools.release_publication sbom --root "$GITHUB_WORKSPACE/repository" \
            --version "$VERSION" --packages "$RUNNER_TEMP/packages" --tool "$RUNNER_TEMP/sbom-tool/sbom-tool" \
            --supplier "$SUPPLIER" --output "$RUNNER_TEMP/sbom-logs"

      - name: Verify the Portable PDBs and derive symbol probes
        run: >-
          dotnet run --project .workflows/tools/NuGetSymbols/NuGetSymbols.csproj --configuration Release --
          --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/symbol-probes.json"

      - name: Check the packages and write the candidate manifest
        id: candidate
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          python3 -E -s -m tools.release_publication candidate --root "$GITHUB_WORKSPACE/repository"
          --version "$VERSION" --packages "$RUNNER_TEMP/packages" --probes "$RUNNER_TEMP/symbol-probes.json"
          --output "$RUNNER_TEMP/candidate"

      - name: Attest build provenance of the packages and the manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
            ${{ runner.temp }}/candidate/candidate.json

      # WHY: GitHub's procedure for immutable releases: "Create the release as a draft. Attach all associated
      # assets to the draft release. Publish the draft release." The tag does not exist yet; publication requires
      # the maintainer's signed tag before it publishes the draft. A re-run uploads only missing assets.
      # https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/immutable-releases
      # WHY: The SBOM jobs run on other runners and the packages artifact holds no SBOMs; they attest exactly the
      # candidate's copies. overwrite: "an artifact with a matching name will be deleted before a new one is
      # uploaded", so a re-run of this job replaces its own earlier upload instead of failing.
      # https://github.com/actions/upload-artifact/blob/v7.0.2/action.yml
      - name: Hand the packages and SBOMs to the SBOM jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-sboms-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/candidate/*.nupkg
            ${{ runner.temp }}/candidate/*.spdx.json
          if-no-files-found: error
          overwrite: true

      - name: Stage every candidate asset in the draft release
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -E -s -m tools.release_publication stage --candidate "$RUNNER_TEMP/candidate"
    outputs:
      packages: ${{ steps.candidate.outputs.packages }}

  # WHY: actions/attest takes one SBOM per call ("sbom-path: Path to the JSON-formatted SBOM file"), so each
  # package's SBOM is attested in its own job. https://github.com/actions/attest/blob/v4.2.2/action.yml
  sbom:
    name: SBOM
    needs: candidate
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    strategy:
      matrix:
        package: ${{ fromJSON(needs.candidate.outputs.packages) }}

    steps:
      - name: Download the candidate packages and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-sboms-${{ inputs.version }}
          path: ${{ runner.temp }}/packages

      - name: Attest the SBOM of the package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packages/${{ matrix.package }}.${{ inputs.version }}.nupkg
          sbom-path: ${{ runner.temp }}/packages/${{ matrix.package }}.spdx.json
