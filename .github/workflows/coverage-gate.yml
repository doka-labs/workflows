name: Coverage Gate

# Merges the Cobertura reports of this run and enforces the thresholds of the
# caller's .github/coverage-policy.json: per assembly and per critical class,
# every shipped assembly measured, no empty report.

on:
  workflow_call:
    inputs:
      reports-pattern:
        description: Name pattern of this run's artifacts that hold the Cobertura reports.
        type: string
        required: true
      source-checkout-roots:
        description: Optional absolute checkout paths from other report-producing jobs, one per line.
        type: string
        default: ''
      runs-on:
        description: Runner label with Python 3 and Bash installed.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    # WHY: actions read downloads this run's coverage artifacts.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ inputs.runs-on }}
    # WHY: A bound against hangs: the coverage jobs of the three repositories read a few XML files.
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repository

      # WHY: The tool comes from the same commit as this workflow, not from a branch head.
      - name: Check out the coverage tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Download this run's coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.reports-pattern }}
          path: ${{ runner.temp }}/coverage

      - name: Enforce the coverage policy
        shell: bash
        env:
          SOURCE_CHECKOUT_ROOTS: ${{ inputs.source-checkout-roots }}
        run: |
          # WHY: The default checkout uses GITHUB_WORKSPACE; an explicit checkout path is also relative to it.
          # Producers using another workspace or checkout subdirectory can name its absolute root explicitly.
          # https://github.com/actions/checkout/tree/v7.0.1#usage
          arguments=(--checkout-root "$GITHUB_WORKSPACE")
          while IFS= read -r root; do
            if [ -n "$root" ]; then
              arguments+=(--checkout-root "$root")
            fi
          done <<< "$SOURCE_CHECKOUT_ROOTS"
          python3 -I .workflows/tools/coverage/coverage.py --reports "$RUNNER_TEMP/coverage" \
            --policy repository/.github/coverage-policy.json --release-policy repository/.github/release-policy.json \
            "${arguments[@]}"
