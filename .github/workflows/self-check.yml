name: Self Check

# Checks this repository itself: workflow syntax with actionlint and the
# unit tests of the tools, on the runner image the workflows default to.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY: The helper repository lints itself with the same workflow it offers to the product repositories. "$/" is
  # GitHub's self-repository reference: it resolves to this repository at the running commit, independent of the
  # workspace. https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
  lint:
    name: Lint
    uses: $/.github/workflows/workflow-lint.yml

  tests:
    name: Tool Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHY: The tests build the NuGetSymbols tool and run it against a freshly packed library.
      - name: Set up the .NET SDK of this repository
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run the tool tests
        run: python3 -E -s -m unittest discover -s tools -p 'test_*.py' -t . -v
