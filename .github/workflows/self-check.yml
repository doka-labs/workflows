name: Self Check

# Checks this repository itself: workflow syntax with actionlint and the
# unit tests of the tools, on the runner image the workflows default to.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHY: The checksum comes from the release's published checksums file; a changed archive fails here.
      - name: Install actionlint 1.7.12
        env:
          ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar --extract --gzip --file "$RUNNER_TEMP/$ARCHIVE" --directory "$RUNNER_TEMP/actionlint" actionlint

      - name: Check the workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

  tests:
    name: Tool Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHY: The tests build the NuGetSymbols tool and run it against a freshly packed library.
      - name: Set up the .NET SDK of this repository
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run the tool tests
        run: python3 -E -s -m unittest discover -s tools -p 'test_*.py' -t . -v
