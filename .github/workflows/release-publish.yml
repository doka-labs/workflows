name: Release Publish

# Publishes an approved candidate: after the environment's reviewer approval it
# rechecks the candidate assets against their attestations, current authority,
# the publisher environment and the signed tag, records the admission, pushes
# the packages that nuget.org does not hold yet, reads them back signed with
# their symbols, and only then publishes the immutable GitHub release. A run of
# this job that stopped anywhere continues from the observed state.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag of the candidate, v<version>.
        type: string
        required: true
      environment:
        description: Publisher environment; must equal release.environment of the release policy.
        type: string
        default: nuget
      runs-on:
        description: Runner label.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04
    secrets:
      NUGET_USER:
        description: nuget.org user name of the Trusted Publishing policy.
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    # WHY: contents write lists the draft and publishes the release; id-token signs the admission and obtains the
    # NuGet credential through Trusted Publishing; attestations write stores the admission. actions read is the
    # repository permission of "GET /repos/{owner}/{repo}/environments/{environment_name}" and of its deployment
    # branch policies, which the environment check reads.
    # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
    # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    environment: ${{ inputs.environment }}
    # WHY: Publications of one repository run one after another and are never cancelled midway; queue: max keeps
    # up to 100 waiting. https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency
    concurrency:
      group: ${{ github.repository }}-publication
      cancel-in-progress: false
      queue: max
    runs-on: ${{ inputs.runs-on }}
    # WHY: Successful publish jobs took up to 60.1 minutes (NestedSet) and 46.6 minutes (MySql) in 31 runs; the NuGet
    # readback alone may wait one hour. 180 minutes is NestedSet's limit.
    timeout-minutes: 180

    steps:
      # WHY: fetch-depth 0 keeps the history that proves the tagged commit belongs to the protected line.
      - name: Check out the release source with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: repository

      # WHY: Checkout removes its credentials, and GitHub "may temporarily require authentication for some clones
      # and fetches of public repositories over HTTPS"; NestedSet's publication failed with HTTP 403 on such a read
      # (run 44952104737). The helper lends the job token to Git without storing it.
      # https://github.blog/changelog/2026-10-19-some-git-over-https-may-temporarily-require-authentication
      - name: Authenticate Git reads with the job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com

      # WHY: The tools come from the same commit as this workflow, not from a branch head. They run as a package
      # with -E -s from their own checkout: -I would also drop the working directory, which "python -m" otherwise
      # puts first on sys.path. https://docs.python.org/3/using/cmdline.html
      - name: Check out the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Set up the repository's .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: repository/global.json

      - name: Download the candidate from its draft release
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 -E -s -m tools.release_publication download-candidate --tag "$TAG" --output "$RUNNER_TEMP/candidate"

      - name: Recheck candidate, authority, environment and signed tag
        id: authorize
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          python3 -E -s -m tools.release_publication authorize --root "$GITHUB_WORKSPACE/repository"
          --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/admission"

      - name: Attest the admission before any irreversible write
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/candidate.json
          predicate-type: https://github.com/doka-labs/workflows/blob/main/docs/predicates/release-admission-v1.md
          predicate-path: ${{ steps.authorize.outputs.admission }}

      - name: List the packages nuget.org does not hold yet
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -E -s -m tools.release_publication pending-packages --candidate "$RUNNER_TEMP/candidate"
          --output "$RUNNER_TEMP/pending.txt" --symbols-output "$RUNNER_TEMP/symbols.txt"

      - name: Obtain a short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # WHY: Bytes, attestations, authority, environment and tag are checked again right before the first
      # irreversible write (MySql, SafeMigrations and NestedSet).
      - name: Recheck before pushing to nuget.org
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 -E -s -m tools.release_publication recheck --root "$GITHUB_WORKSPACE/repository" --candidate "$RUNNER_TEMP/candidate"

      # WHY: --skip-duplicate keeps a package that another attempt pushed in the meantime from failing the push;
      # its bytes were compared with the candidate in the previous step and are read back below. --no-symbols
      # keeps the primary push from also pushing the .snupkg next to it, so every primary precedes every symbol
      # package; the symbol packages follow for every package, because an attempt can stop between the two
      # pushes (NestedSet and SafeMigrations push all symbol packages with --skip-duplicate on every run).
      # https://learn.microsoft.com/dotnet/core/tools/dotnet-nuget-push
      - name: Push the pending packages, then every symbol package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            dotnet nuget push "$RUNNER_TEMP/candidate/$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate --timeout 300
          done < "$RUNNER_TEMP/pending.txt"
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            dotnet nuget push "$RUNNER_TEMP/candidate/$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate --timeout 300
          done < "$RUNNER_TEMP/symbols.txt"

      - name: Read the packages and symbols back from nuget.org
        id: readback
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -E -s -m tools.release_publication readback --candidate "$RUNNER_TEMP/candidate"
          --work "$RUNNER_TEMP/readback" --root "$GITHUB_WORKSPACE/repository"

      # WHY: A consumer that restores each package from nuget.org only must receive the candidate's payload before
      # the release is published (MySql's isolated consumer).
      - name: Restore every package from nuget.org in an isolated consumer
        if: steps.readback.outputs.complete == 'true'
        working-directory: .workflows
        run: >-
          python3 -E -s -m tools.release_publication public-consumers --root "$GITHUB_WORKSPACE/repository"
          --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/public-consumers"

      - name: Publish the immutable GitHub release
        if: steps.readback.outputs.complete == 'true'
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          python3 -E -s -m tools.release_publication publish-release --root "$GITHUB_WORKSPACE/repository"
          --candidate "$RUNNER_TEMP/candidate"
