name: API Reference

# Builds the API reference of the shipped packages and the documents under
# docs/ with DocFX from the released tag, and publishes the site on the
# repository's GitHub Pages. The highest stable release replaces the site;
# before the first stable release the highest pre-release does. The site is
# built for every release, so a broken document fails the run even when the
# site is kept.

on:
  workflow_call:
    inputs:
      tag:
        description: Released tag, v<version>.
        type: string
        required: true
      pack-configuration:
        description: MSBuild configuration in which the packages were packed.
        type: string
        default: Release
      runs-on:
        description: Linux x64 runner label for the DocFX build and the Pages deploy job.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04

permissions:
  contents: read

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    # WHY: A bound against hangs: restoring the shipped projects and building the site take a few minutes.
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}

    steps:
      # WHY: The pinned DocFX archive contains a Linux x64 executable.
      # https://github.com/dotnet/docfx/releases/tag/v2.81.0
      - name: Require a Linux x64 runner
        if: runner.os != 'Linux' || runner.arch != 'X64'
        run: |
          echo '::error::API reference requires a Linux x64 runner.'
          exit 1

      # WHY: An unqualified name can select a same-named branch before the tag. The immutable release names a tag.
      # https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/src/ref-helper.ts#L44-L58
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          path: repository

      # WHY: The tools come from the same commit as this workflow, not from a branch head. They run as a package
      # with -E -s from their own checkout. https://docs.python.org/3/using/cmdline.html
      - name: Check out the site tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      # WHY: DocFX loads the projects through MSBuildWorkspace, which needs the SDK the repository builds with.
      # https://dotnet.github.io/docfx/docs/dotnet-api-docs.html
      - name: Set up the repository's .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: repository/global.json

      # WHY: DocFX 2.81.0 is the newest release; the Linux archive carries its own .NET runtime, and the digest is
      # the one GitHub reports for the release asset. The project publishes no attestation for it.
      # https://github.com/dotnet/docfx/releases/tag/v2.81.0
      - name: Install DocFX 2.81.0
        env:
          SHA256: 6d20feb116665518e85794db00935f39cacf9d812134cd0d0e4134218f7c5510
        run: |
          mkdir -p "$RUNNER_TEMP/docfx"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/docfx.zip" \
            https://github.com/dotnet/docfx/releases/download/v2.81.0/docfx-linux-x64-v2.81.0.zip
          echo "$SHA256  $RUNNER_TEMP/docfx.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/docfx.zip" -d "$RUNNER_TEMP/docfx"

      - name: Decide whether the release replaces the site
        id: decide
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must be v<version>"; exit 1; }
          python3 -E -s -m tools.api_reference should-deploy --repository "$GITHUB_REPOSITORY" --version "${TAG#v}"

      # WHY: The site lists the records from the index madr-check writes; the digest is madr-check 0.1.1, the same as
      # in decision-records.yml. The tool needs the .git of the checkout to resolve links and writes as the runner user.
      - name: Write the decision index
        if: hashFiles('repository/docs/decisions/*.md') != ''
        working-directory: repository
        run: |
          set -euo pipefail
          image='ghcr.io/kdominic89/madr-check@sha256:933d050d1e8d7fa00b5b13191a26c19bf40fcbeb0e2a0c4e7e6384548a993a6d'
          docker run --rm --network none --user "$(id -u):$(id -g)" --volume "${PWD}:/work" \
            "${image}" index write --profile doka docs/decisions

      # WHY: Links to repository files the site does not hold become GitHub links at the released tag, so the
      # checkout keeps its relative links for the checkers and the site shows them as DocFX users link source.
      - name: Generate the site sources
        id: generate
        working-directory: .workflows
        env:
          TAG: ${{ inputs.tag }}
          PACK_CONFIGURATION: ${{ inputs.pack-configuration }}
        run: >-
          python3 -E -s -m tools.api_reference generate --root "$GITHUB_WORKSPACE/repository"
          --title "${GITHUB_REPOSITORY#*/}" --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          --pack-configuration "$PACK_CONFIGURATION"

      # WHY: DocFX evaluates the projects with the pack's configuration and the tag's version, so the restore uses
      # the same properties; a dependency that depends on them would otherwise resolve differently.
      # https://learn.microsoft.com/visualstudio/msbuild/msbuild-conditions
      - name: Restore the shipped projects
        working-directory: repository
        env:
          PROJECTS: ${{ steps.generate.outputs.projects }}
          PACK_CONFIGURATION: ${{ inputs.pack-configuration }}
          TAG: ${{ inputs.tag }}
        run: |
          for project in $PROJECTS; do
            dotnet restore "$project" -p:ContinuousIntegrationBuild=true "-p:Configuration=$PACK_CONFIGURATION" \
              "-p:Version=${TAG#v}" "-p:PackageVersion=${TAG#v}"
          done

      # WHY: Warnings fail the build, so a missing XML comment or a broken link never reaches the published site.
      - name: Build the site
        working-directory: repository
        run: '"$RUNNER_TEMP/docfx/docfx" .docfx/docfx.json --warningsAsErrors'

      - name: Upload the site
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository/.docfx/_site

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    # WHY: Deploying to Pages needs pages write and an OIDC token, in the github-pages environment. Contents read
    # lets the job check out the pinned site tools and read the release list before deploying.
    # https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
    # https://docs.github.com/en/rest/releases/releases#list-releases
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    # WHY: Only one deployment runs at a time. queue: max keeps a waiting highest release from being replaced by
    # a lower one that finished building later. Neither supersedes a running deployment.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    concurrency:
      group: ${{ github.repository }}-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # WHY: The final decision uses the trusted tools at the reusable workflow's commit, as the build did.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - name: Check out the site tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      # WHY: The build's decision can grow stale while building or waiting in the queue. Sample the release list
      # while the Pages lock is held, immediately before using the artifact from this run.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      - name: Recheck which release replaces the site
        id: decide
        working-directory: .workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 -E -s -m tools.api_reference should-deploy --repository "$GITHUB_REPOSITORY" --version "${TAG#v}"

      - name: Deploy the site
        if: steps.decide.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
