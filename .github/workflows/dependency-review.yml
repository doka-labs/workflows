name: Dependency Review

# Reviews the dependency delta of a pull request before it can merge, with
# actions/dependency-review-action against the dependency graph GitHub holds
# for the base and head commits.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the review job.
        type: string
        # WHY: The newest generally available GitHub-hosted Ubuntu image.
        # https://github.com/actions/runner-images/issues/14747
        default: ubuntu-26.04
      fail-on-severity:
        description: Lowest advisory severity that fails the review.
        type: string
        # WHY: The value of MySql, SafeMigrations and NestedSet. Lower severities still fail the scheduled
        # dependency audit, which treats every NuGet audit severity as an error.
        default: high
      allow-licenses:
        description: Comma-separated SPDX identifiers allowed by the repository dependency policy.
        type: string
        # WHY: The union of the lists of MySql, SafeMigrations and NestedSet; PostgreSQL is the license of Npgsql,
        # used by SafeMigrations and NestedSet.
        default: >-
          Apache-2.0,
          BSD-2-Clause,
          BSD-3-Clause,
          CC0-1.0,
          ISC,
          MIT,
          MIT-0,
          PostgreSQL,
          Unlicense
      license-exceptions:
        description: >-
          Comma-separated NuGet package URLs with exact versions (pkg:nuget/Name@1.2.3) whose
          reviewed license files replace an SPDX expression. Any other version of these packages fails.
        type: string
        # WHY: These packages declare <license type="file"> instead of an SPDX expression in their nuspec on
        # nuget.org, so the action cannot match them against allow-licenses. Their license files were reviewed at
        # exactly these versions; another version fails until it is reviewed.
        # https://api.nuget.org/v3-flatcontainer/microsoft.data.sqlclient.sni.runtime/6.0.3/microsoft.data.sqlclient.sni.runtime.nuspec
        # https://api.nuget.org/v3-flatcontainer/microsoft.identity.client.nativeinterop/0.20.6/microsoft.identity.client.nativeinterop.nuspec
        # SQLite 3.53.4 (pulled in by Microsoft.EntityFrameworkCore.Sqlite 11.0.0 through
        # SQLitePCLRaw.bundle_e_sqlite3 3.0.5) also declares a license file; it reads "SQLite is Public Domain", which
        # sqlite.org confirms. GitHub reports it as LicenseRef-github-OTHER (SafeMigrations run 45058900529).
        # https://api.nuget.org/v3-flatcontainer/sqlite/3.53.4/sqlite.nuspec
        # https://sqlite.org/copyright.html
        default: >-
          pkg:nuget/Microsoft.Data.SqlClient.SNI.runtime@6.0.3,
          pkg:nuget/Microsoft.Identity.Client.NativeInterop@0.20.6,
          pkg:nuget/SQLite@3.53.4

permissions:
  contents: read

jobs:
  review:
    name: Review
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    # WHY: A bound against hangs: the review jobs of MySql and NestedSet took at most 3.4 minutes in 65 successful
    # runs, including the action's wait for snapshots (180 seconds); 10 minutes is their common limit.
    timeout-minutes: 10

    # WHY: The action reads the dependency graph through the API; it reads local files only for a config-file,
    # which this workflow does not use, so the calling repository is not checked out.
    steps:
      # WHY: The tool must come from the same commit as this workflow, not from a branch head.
      - name: Check out the review tool
        if: ${{ inputs.license-exceptions != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows
          persist-credentials: false

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
          allow-dependencies-licenses: ${{ inputs.license-exceptions }}
          # WHY: "If enabled, you must give the workflow or job the pull-requests: write permission"; the result
          # is the check itself. https://github.com/actions/dependency-review-action#configuration-options
          comment-summary-in-pr: never
          # WHY: OpenSSF Scorecard is not part of the shared standard; the action's default is true.
          # https://github.com/actions/dependency-review-action#configuration-options
          show-openssf-scorecard: false
          # WHY: The dependency graph of a new commit can arrive after the review starts; the action retries every
          # 10 seconds up to the timeout instead of failing on incomplete snapshots. 180 seconds is the value of
          # MySql, SafeMigrations and NestedSet; the action's default is 120.
          # https://github.com/actions/dependency-review-action#configuration-options
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180

      - name: Require exact license-exception versions
        if: ${{ inputs.license-exceptions != '' }}
        env:
          DEPENDENCY_CHANGES_FILE: ${{ runner.temp }}/dependency-review-output.json
          LICENSE_EXCEPTIONS: ${{ inputs.license-exceptions }}
        shell: bash
        run: |
          set -euo pipefail

          # WHY: Passed through an environment variable, a large comparison failed to start bash with "Argument list
          # too long" (NestedSet run 44899846960). A quoted heredoc of one JSON string carries any size, and
          # dependency metadata can neither run shell code nor end the data early.
          cat > "$DEPENDENCY_CHANGES_FILE" <<'DEPENDENCY_REVIEW_OUTPUT'
          ${{ toJSON(steps.review.outputs.dependency-changes) }}
          DEPENDENCY_REVIEW_OUTPUT

          python3 -I .workflows/tools/dependency_review/license_exceptions.py \
            --changes "$DEPENDENCY_CHANGES_FILE" --exceptions "$LICENSE_EXCEPTIONS"
